<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <div class="info">
            <p>You are <span class="player-marker">X</span> | AI is <span class="ai-marker">O</span></p>
            <p>Difficulty: <span class="difficulty">Medium</span></p>
        </div>
        
        <div class="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="status" id="status">Your Turn</div>

        <div class="stats">
            <p>Your Wins: <span id="playerWins">0</span></p>
            <p>AI Wins: <span id="aiWins">0</span></p>
            <p>Draws: <span id="draws">0</span></p>
        </div>

        <button class="reset-button" onclick="resetGame()">New Game</button>
        <button class="reset-stats-button" onclick="resetStats()">Reset Stats</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
